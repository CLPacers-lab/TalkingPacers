<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talking Pacers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: rgba(255, 255, 255, 0.92);
        --ink: #0f172a;
        --muted: #5b6475;
        --line: rgba(15, 23, 42, 0.1);
        --blue: #002d62;
        --gold: #fdbb30;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Source Sans 3", "Helvetica Neue", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(253, 187, 48, 0.18), transparent 24%),
          radial-gradient(circle at 85% 15%, rgba(0, 45, 98, 0.12), transparent 20%),
          linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 760px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 18px 60px rgba(0, 45, 98, 0.12);
        padding: 28px;
        position: relative;
        backdrop-filter: blur(12px);
      }

      .lock-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        border-radius: 999px;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
      }

      .lock-btn:hover { color: var(--ink); }

      .gate, .app {
        display: none;
      }

      .gate.active, .app.active {
        display: block;
      }

      h1 {
        margin: 0 0 10px;
        font-family: Oswald, sans-serif;
        font-size: clamp(2.2rem, 8vw, 4.8rem);
        line-height: 0.95;
        letter-spacing: 0.02em;
        color: var(--blue);
      }

      .subtle {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1rem;
      }

      .field,
      .ask-box {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px 18px;
        font: inherit;
        font-size: 1rem;
        color: var(--ink);
        background: #fff;
        resize: vertical;
      }

      .field { margin-bottom: 12px; }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 14px;
        align-items: center;
        flex-wrap: wrap;
      }

      .btn {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--blue), #1c4f90);
        color: #fff;
      }

      .btn-secondary {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--muted);
      }

      .status {
        min-height: 24px;
        margin-top: 12px;
        color: var(--muted);
      }

      .answer {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--ink);
        white-space: pre-wrap;
      }

      .hint {
        margin-top: 10px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .card { padding: 22px; border-radius: 20px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <main class="card" aria-live="polite">
        <button id="logoutButton" class="lock-btn" type="button" hidden title="Lock and log out">Lock</button>

        <section id="passwordGate" class="gate active" aria-labelledby="gate-title">
          <h1 id="gate-title">Talking Pacers</h1>
          <p class="subtle">Enter the site password to continue.</p>
          <input id="passwordInput" class="field" type="password" placeholder="Password" autocomplete="current-password" />
          <div class="actions">
            <button id="unlockButton" class="btn btn-primary" type="button">Enter</button>
          </div>
          <p id="gateStatus" class="status"></p>
        </section>

        <section id="chatApp" class="app" aria-labelledby="app-title">
          <h1 id="app-title">Let's talk pacers.</h1>
          <p class="subtle">Ask a Pacers question.</p>
          <textarea id="questionInput" class="ask-box" rows="6" placeholder="What do you want to know about the Pacers?"></textarea>
          <div class="actions">
            <button id="askButton" class="btn btn-primary" type="button">Ask</button>
          </div>
          <p id="askStatus" class="status"></p>
          <p class="hint">Powered by a server-side Pacers assistant.</p>
          <div id="responseBox" class="answer" hidden></div>
        </section>
      </main>
    </div>

    <script>
      const PASSWORD = 'IkeDiogu';
      const ACCESS_KEY = 'talking_pacers_access';

      const passwordGate = document.getElementById('passwordGate');
      const chatApp = document.getElementById('chatApp');
      const passwordInput = document.getElementById('passwordInput');
      const gateStatus = document.getElementById('gateStatus');
      const responseBox = document.getElementById('responseBox');
      const askStatus = document.getElementById('askStatus');
      const questionInput = document.getElementById('questionInput');
      const logoutButton = document.getElementById('logoutButton');
      const askButton = document.getElementById('askButton');

      function setUnlocked(unlocked) {
        if (unlocked) {
          localStorage.setItem(ACCESS_KEY, 'granted');
          passwordGate.classList.remove('active');
          chatApp.classList.add('active');
          logoutButton.hidden = false;
          questionInput.focus();
          return;
        }

        localStorage.removeItem(ACCESS_KEY);
        passwordGate.classList.add('active');
        chatApp.classList.remove('active');
        logoutButton.hidden = true;
        responseBox.hidden = true;
        responseBox.textContent = '';
        askStatus.textContent = '';
        gateStatus.textContent = '';
        passwordInput.value = '';
        passwordInput.focus();
      }

      function handleUnlock() {
        if (passwordInput.value === PASSWORD) {
          setUnlocked(true);
        } else {
          gateStatus.textContent = 'Incorrect password.';
        }
      }

      async function handleAsk() {
        const question = questionInput.value.trim();
        if (!question) {
          askStatus.textContent = 'Enter a question first.';
          responseBox.hidden = true;
          return;
        }

        askButton.disabled = true;
        askButton.textContent = 'Thinking...';
        askStatus.textContent = 'Loading...';
        responseBox.hidden = true;

        try {
          const response = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question })
          });

          const payload = await response.json().catch(() => null);
          if (!response.ok) {
            throw new Error(payload?.error || 'OpenAI request failed.');
          }

          if (typeof payload?.answer !== 'string' || !payload.answer.trim()) {
            throw new Error('Malformed response from server.');
          }

          responseBox.textContent = payload.answer.trim();
          responseBox.hidden = false;
          askStatus.textContent = '';
        } catch (error) {
          askStatus.textContent = error.message || 'Something went wrong.';
          responseBox.hidden = true;
        } finally {
          askButton.disabled = false;
          askButton.textContent = 'Ask';
        }
      }

      document.getElementById('unlockButton').addEventListener('click', handleUnlock);
      passwordInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          handleUnlock();
        }
      });

      askButton.addEventListener('click', handleAsk);
      questionInput.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
          event.preventDefault();
          handleAsk();
        }
      });
      logoutButton.addEventListener('click', () => setUnlocked(false));

      if (localStorage.getItem(ACCESS_KEY) === 'granted') {
        setUnlocked(true);
      } else {
        passwordInput.focus();
      }
    </script>
  </body>
</html>
