<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instant GM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #06152d;
        --bg-deep: #03101f;
        --panel: rgba(255, 255, 255, 0.95);
        --line: rgba(255, 255, 255, 0.12);
        --gold: #fdbb30;
        --ink: #0f172a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Source Sans 3", "Helvetica Neue", sans-serif;
        color: #fff;
        background:
          radial-gradient(circle at top left, rgba(253, 187, 48, 0.22), transparent 22%),
          radial-gradient(circle at 80% 10%, rgba(31, 93, 170, 0.28), transparent 24%),
          linear-gradient(160deg, var(--bg) 0%, var(--bg-deep) 100%);
      }
      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(100%, 900px);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.05)),
          rgba(4, 18, 36, 0.72);
        border: 1px solid var(--line);
        border-radius: 32px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        padding: 32px;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(20px);
      }
      .lock-btn, .nav-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.86);
        border-radius: 999px;
        padding: 8px 12px;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .lock-btn { position: absolute; top: 16px; right: 16px; }
      .gate, .app { display: none; }
      .gate.active, .app.active { display: block; }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
      .brand-logo {
        width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,0.94);
        padding: 8px; box-shadow: 0 12px 24px rgba(0,0,0,0.18);
      }
      .brand-mark {
        margin: 0; color: rgba(255, 255, 255, 0.78); font-size: 0.82rem; letter-spacing: 0.22em; text-transform: uppercase;
      }
      h1 {
        margin: 0 0 10px;
        font-family: Oswald, sans-serif;
        font-size: clamp(2.2rem, 8vw, 4.6rem);
        line-height: 0.95;
      }
      .subtitle { margin: 0 0 18px; color: rgba(255,255,255,0.78); }
      .field, .ask-box {
        width: 100%; border: 1px solid rgba(255,255,255,0.16); border-radius: 22px; padding: 18px 20px;
        font: inherit; font-size: 1.02rem; color: var(--ink); background: var(--panel); resize: vertical;
      }
      .field { margin-bottom: 12px; }
      .actions { display: flex; gap: 12px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
      .btn {
        border: 0; border-radius: 999px; padding: 12px 20px; font: inherit; font-weight: 700; cursor: pointer;
      }
      .btn-primary { background: linear-gradient(135deg, var(--gold), #f5a600); color: #17263e; }
      .status { min-height: 24px; margin-top: 12px; color: rgba(255,255,255,0.74); }
      .answer-wrap {
        margin-top: 22px; border-radius: 24px; background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.1); padding: 20px;
      }
      .answer-text { white-space: pre-wrap; line-height: 1.6; }
      .sources { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.12); display: grid; gap: 8px; }
      .sources-title { margin: 0; font-size: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
      .source-link, .source-text { color: #ffe29a; text-decoration: none; }
      .source-link:hover { text-decoration: underline; }
      .topbar { display: flex; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
      @media (max-width: 640px) {
        .card { padding: 24px; border-radius: 24px; }
        .brand-logo { width: 48px; height: 48px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <main class="card">
        <button id="logoutButton" class="lock-btn" type="button" hidden>Lock</button>

        <section id="passwordGate" class="gate active">
          <div class="brand" aria-hidden="true">
            <img class="brand-logo" src="https://cdn.nba.com/logos/nba/1610612754/primary/L/logo.svg" alt="" />
            <p class="brand-mark">Instant GM</p>
          </div>
          <h1>Instant GM</h1>
          <p class="subtitle">Private Pacers front office playground.</p>
          <input id="passwordInput" class="field" type="password" placeholder="Password" autocomplete="current-password" />
          <div class="actions">
            <button id="unlockButton" class="btn btn-primary" type="button">Enter</button>
          </div>
          <p id="gateStatus" class="status"></p>
        </section>

        <section id="gmApp" class="app">
          <div class="topbar">
            <div class="brand" aria-hidden="true">
              <img class="brand-logo" src="https://cdn.nba.com/logos/nba/1610612754/primary/L/logo.svg" alt="" />
              <p class="brand-mark">Instant GM</p>
            </div>
            <a class="nav-link" href="/">Back to TalkingPacers</a>
          </div>
          <h1>Instant GM</h1>
          <p class="subtitle">Ask about Pacers payroll, apron distance, and curated CBA rules.</p>
          <textarea id="questionInput" class="ask-box" rows="4" placeholder="Try: What is Haliburton making?"></textarea>
          <div class="actions">
            <button id="askButton" class="btn btn-primary" type="button">Ask</button>
          </div>
          <p id="askStatus" class="status"></p>
          <section id="answerWrap" class="answer-wrap" hidden>
            <div id="answerText" class="answer-text"></div>
            <div id="sourcesWrap" class="sources" hidden>
              <p class="sources-title">Sources</p>
              <div id="sourcesList"></div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script>
      const PASSWORD = 'IkeDiogu';
      const ACCESS_KEY = 'talking_pacers_access';

      const passwordGate = document.getElementById('passwordGate');
      const gmApp = document.getElementById('gmApp');
      const passwordInput = document.getElementById('passwordInput');
      const gateStatus = document.getElementById('gateStatus');
      const askStatus = document.getElementById('askStatus');
      const questionInput = document.getElementById('questionInput');
      const askButton = document.getElementById('askButton');
      const logoutButton = document.getElementById('logoutButton');
      const answerWrap = document.getElementById('answerWrap');
      const answerText = document.getElementById('answerText');
      const sourcesWrap = document.getElementById('sourcesWrap');
      const sourcesList = document.getElementById('sourcesList');

      function setUnlocked(unlocked) {
        if (unlocked) {
          localStorage.setItem(ACCESS_KEY, 'granted');
          passwordGate.classList.remove('active');
          gmApp.classList.add('active');
          logoutButton.hidden = false;
          questionInput.focus();
          return;
        }

        localStorage.removeItem(ACCESS_KEY);
        passwordGate.classList.add('active');
        gmApp.classList.remove('active');
        logoutButton.hidden = true;
        passwordInput.value = '';
        questionInput.value = '';
        gateStatus.textContent = '';
        askStatus.textContent = '';
        answerWrap.hidden = true;
        sourcesWrap.hidden = true;
        sourcesList.innerHTML = '';
        passwordInput.focus();
      }

      function handleUnlock() {
        if (passwordInput.value === PASSWORD) {
          setUnlocked(true);
        } else {
          gateStatus.textContent = 'Incorrect password.';
        }
      }

      async function handleAsk() {
        const question = questionInput.value.trim();
        if (!question) {
          askStatus.textContent = 'Enter a question first.';
          return;
        }

        askButton.disabled = true;
        askButton.textContent = 'Thinking...';
        askStatus.textContent = 'Loading...';

        try {
          const response = await fetch('/api/instant-gm/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question })
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok) {
            throw new Error(payload?.error || 'Instant GM request failed.');
          }
          if (typeof payload?.answer !== 'string' || !payload.answer.trim()) {
            throw new Error('Malformed response from Instant GM.');
          }

          answerText.textContent = payload.answer.trim();
          answerWrap.hidden = false;
          sourcesList.innerHTML = '';
          const sources = Array.isArray(payload?.sources) ? payload.sources : [];
          sourcesWrap.hidden = sources.length === 0;

          for (const source of sources) {
            if (source.url) {
              const link = document.createElement('a');
              link.className = 'source-link';
              link.href = source.url;
              link.target = '_blank';
              link.rel = 'noreferrer';
              link.textContent = source.title || source.url;
              sourcesList.appendChild(link);
            } else {
              const text = document.createElement('p');
              text.className = 'source-text';
              text.textContent = source.title || 'No source link available.';
              sourcesList.appendChild(text);
            }
          }

          askStatus.textContent = '';
        } catch (error) {
          answerWrap.hidden = true;
          askStatus.textContent = error.message || 'Something went wrong.';
        } finally {
          askButton.disabled = false;
          askButton.textContent = 'Ask';
          questionInput.focus();
        }
      }

      document.getElementById('unlockButton').addEventListener('click', handleUnlock);
      passwordInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          handleUnlock();
        }
      });
      askButton.addEventListener('click', handleAsk);
      questionInput.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
          event.preventDefault();
          handleAsk();
        }
      });
      logoutButton.addEventListener('click', () => setUnlocked(false));

      if (localStorage.getItem(ACCESS_KEY) === 'granted') {
        setUnlocked(true);
      } else {
        passwordInput.focus();
      }
    </script>
  </body>
</html>
